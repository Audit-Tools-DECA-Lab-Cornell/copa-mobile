name: Mobile Quality

on:
    pull_request:
        branches: ["master"]
    push:
        branches: ["master"]

concurrency:
    group: mobile-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality Gate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "25"

            - name: Install dependencies
              run: bun install

            - name: Run quality checks
              run: bun run check

            # `bun run check` does not run vitest, so the design-token tests - which are
            # what prove the generated theme modules still match the frozen palette -
            # would never execute in CI. Run them explicitly.
            - name: Design token tests
              run: bunx vitest run tests/design-tokens.spec.ts

            # `tamagui.generated.css` is a committed build artifact of themes.ts, and
            # nothing else covers it: it is excluded from eslint and prettier, and
            # `tokens:check` only knows about the modules the token generator writes.
            # It went stale during the Coastal Blues migration - the palette moved and
            # the committed stylesheet kept the warm ramp - so regenerate it here and
            # fail if the result differs from what is checked in.
            - name: Tamagui CSS is in sync with themes.ts
              run: |
                  bunx tamagui generate-css
                  if ! git diff --quiet -- tamagui.generated.css; then
                    echo "tamagui.generated.css is stale. Run 'bunx tamagui generate-css' and commit the result."
                    git --no-pager diff --stat -- tamagui.generated.css
                    exit 1
                  fi
                  echo "tamagui.generated.css matches themes.ts."

            # Colour is defined once, in copa-frontend/brand/tokens.json, and vendored
            # into this repo. `bun run check` proves the generated modules match the
            # local copy; this step proves the local copy still matches copa-frontend.
            # Skipped when no cross-repo token is configured, so forks stay green.
            - name: Verify token sync with copa-frontend
              env:
                  GITHUB_TOKEN: ${{ secrets.TOKENS_SYNC_TOKEN }}
              run: |
                  if [ -z "$GITHUB_TOKEN" ]; then
                    echo "TOKENS_SYNC_TOKEN not configured - skipping cross-repo token sync check."
                    exit 0
                  fi
                  node scripts/verify-token-sync.mjs --url \
                    "https://api.github.com/repos/${{ github.repository_owner }}/copa-frontend/contents/brand/tokens.json?ref=master"

            - name: Run Expo doctor
              run: bun run doctor
