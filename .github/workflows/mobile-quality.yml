name: Mobile Quality

on:
    pull_request:
        branches: ["master"]
    push:
        branches: ["master"]

concurrency:
    group: mobile-quality-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality:
        name: Quality Gate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.13"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "25"

            - name: Install dependencies
              run: bun install

            - name: Run quality checks
              run: bun run check

            # Colour is defined once, in copa-frontend/brand/tokens.json, and vendored
            # into this repo. `bun run check` proves the generated modules match the
            # local copy; this step proves the local copy still matches copa-frontend.
            # Skipped when no cross-repo token is configured, so forks stay green.
            - name: Verify token sync with copa-frontend
              env:
                  GITHUB_TOKEN: ${{ secrets.TOKENS_SYNC_TOKEN }}
              run: |
                  if [ -z "$GITHUB_TOKEN" ]; then
                    echo "TOKENS_SYNC_TOKEN not configured - skipping cross-repo token sync check."
                    exit 0
                  fi
                  node scripts/verify-token-sync.mjs --url \
                    "https://api.github.com/repos/${{ github.repository_owner }}/copa-frontend/contents/brand/tokens.json?ref=master"

            - name: Run Expo doctor
              run: bun run doctor
